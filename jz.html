<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>捐赠网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
            margin-bottom: 8px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 12px;
            background: #e0e0e0;
            color: #666;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #333;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .tab-content {
            display: none;
            width: 100%;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .img-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: 100%;
            text-align: center;
        }
        .img-card img {
            width: 100%;
            display: block;
        }
        .text-section {
            background: #fff;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: 100%;
            text-align: center;
        }
        .text-section p {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }
        .code {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
        .link-card {
            background: #fff;
            border-radius: 16px;
            padding: 28px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: 100%;
            text-align: center;
        }
        .link-card h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
        }
        .link-card p {
            font-size: 15px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 16px;
        }
        .link-card a {
            display: inline-block;
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            transition: background 0.2s;
        }
        .link-card a:hover {
            background: #555;
        }
        .link-text {
            display: block;
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            margin-top: 12px;
            word-break: break-all;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(0)">1</button>
            <button class="tab-btn" onclick="switchTab(1)">2</button>
            <button class="tab-btn" onclick="switchTab(2)">3</button>
        </div>

        <!-- 界面 1 -->
        <div class="tab-content active">
            <div class="img-card">
                <img src="jz1.jpg" alt="扫码下载注册">
            </div>
            <div class="text-section">
                <p>注册后我会获得0.5~1米</p>
                <span class="code">感谢你的支持</span>
            </div>
        </div>

        <!-- 界面 2 -->
        <div class="tab-content">
                    <div class="img-card">
                <img src="" alt="">
            </div>
            <div class="text-section">
                <p>关了</p>
            </div>
        </div>
    </div>

        <!-- 界面 3 -->
        <div class="tab-content">
                    <div class="img-card">
                <img src="jz2.jpg" alt="扫码下载注册">
            </div>
            <div class="text-section">
                <p>扫描二维码注册我也许可以获得1米感谢你的支持</p>
            </div>
        </div>
    </div>

    <script>
        function switchTab(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((content, i) => {
                content.classList.toggle('active', i === index);
            });
        }
    </script>
</body>
</html>
