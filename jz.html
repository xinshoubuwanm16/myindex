<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>捐赠网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .img-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: 100%;
            text-align: center;
        }
        .img-card img {
            width: 100%;
            display: block;
        }
        .text-section {
            background: #fff;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: 100%;
            text-align: center;
        }
        .text-section p {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }
        .code {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="img-card">
            <img src="jz1.jpg" alt="京东E卡10元">
        </div>
        <div class="img-card">
            <img src="jz2.jpg" alt="邀请好友得积分">
        </div>
        <div class="text-section">
            <p>如果你是元宝新用户，你就可以给我免费捐赠1.5块用元宝参与助力，助我赢积分！</p>
            <span class="code">用元宝参̂与̈助力，助̈好⁢友̂赢́积‌分！ UA2829 Vfu0:/5XRUFZ5L979R</span>
        </div>
    </div>
</body>
</html>
