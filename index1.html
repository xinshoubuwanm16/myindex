<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随机美图</title>
    <style>
        /* ===== 精简美观样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f8ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 92vh;
            max-height: 820px;
            background: #f0f8ff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,.15);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            height: 56px;
            background: rgba(255,255,255,.75);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid #d6eaf8;
            flex-shrink: 0;
        }
        .btn-icon {
            background: #ebf5fb;
            border: 1px solid #4a90d9;
            border-radius: 18px;
            padding: 4px 14px;
            font-size: 12px;
            color: #4a90d9;
            cursor: pointer;
            height: 36px;
            display: flex;
            align-items: center;
            font-weight: 500;
        }
        .btn-icon:active { transform: scale(.95); }
        .topbar-title {
            font-size: 22px;
            font-weight: 700;
            color: #4a90d9;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .source-btn {
            background: #ebf5fb;
            border: 1px solid #4a90d9;
            border-radius: 18px;
            padding: 4px 12px;
            height: 36px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #4a90d9;
            font-weight: 500;
        }
        .source-btn:active { transform: scale(.95); }
        .image-wrapper {
            flex: 1;
            padding: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-card {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 24px;
            border: 2px solid #d6eaf8;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
            display: block;
        }
        .placeholder {
            color: #b0c4de;
            font-size: 16px;
            text-align: center;
            padding: 20px;
            user-select: none;
            cursor: pointer;
        }
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            border: 4px solid #d6eaf8;
            border-top: 4px solid #4a90d9;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            display: none;
            z-index: 5;
            pointer-events: none;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .image-info {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(240,248,255,.88);
            backdrop-filter: blur(4px);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            color: #1a2a3a;
            text-align: center;
            border: 1px solid rgba(214,234,248,.6);
            z-index: 2;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
            line-height: 1.4;
        }
        .image-info.error { color: #e74c3c; }
        .image-info.success { color: #27ae60; }
        .bottom-area {
            padding: 12px 16px 16px;
            background: rgba(240,248,255,.85);
            backdrop-filter: blur(4px);
            border-top: 1px solid #d6eaf8;
            flex-shrink: 0;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-row .btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }
        .btn-row .btn:active { transform: scale(.96); }
        .btn-primary { background: linear-gradient(135deg, #2980b9, #1f618d); }
        .btn-secondary { background: linear-gradient(135deg, #4a90d9, #4a90d9); }
        .btn-outline { background: #ebf5fb; color: #4a90d9!important; border: 1px solid #4a90d9!important; box-shadow: none!important; }
        .btn-dark { background: #1a0d1a; color: #fff; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,.45);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #f0f8ff;
            border-radius: 28px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            position: relative;
        }
        .modal-box h3 { color: #4a90d9; font-size: 20px; margin-bottom: 14px; text-align: center; }
        .modal-box .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-item {
            padding: 12px 16px;
            border-radius: 14px;
            background: #fff;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid #e8f0f8;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-item:active { transform: scale(.97); background: #ebf5fb; }
        .modal-item .badge { font-size: 11px; color: #999; margin-left: auto; }
        .modal-input-group { margin-bottom: 14px; }
        .modal-input-group label { display: block; font-size: 14px; color: #4a90d9; font-weight: 600; margin-bottom: 4px; }
        .modal-input-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1.5px solid #d6eaf8;
            font-size: 15px;
            background: #fff;
            outline: none;
        }
        .modal-input-group input:focus { border-color: #4a90d9; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .modal-actions .btn:active { transform: scale(.96); }
        .btn-confirm { background: #4a90d9; color: #fff; }
        .btn-cancel { background: #ebf5fb; color: #4a90d9; border: 1px solid #d6eaf8; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .toast-tip {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,.72);
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            max-width: 85%;
            text-align: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
            transition: opacity .3s;
            pointer-events: none;
        }
        @media (max-width: 420px) {
            .topbar-title { font-size: 18px; }
            .btn-icon, .source-btn { font-size: 11px; padding: 3px 10px; height: 32px; }
            .btn-row .btn { height: 42px; font-size: 13px; }
            .image-info { font-size: 12px; padding: 8px 12px; bottom: 12px; }
        }
    </style>

<body>
<div id="app">
    <!-- 顶部栏 -->
    <div class="topbar">
        <div class="topbar-left"><button class="btn-icon" id="btnSettings">⚙️ 设置</button></div>
        <span class="topbar-title">随机美图</span>
        <div class="topbar-right">
            <div class="source-btn" id="btnSourceSwitch">
                <span id="currentSourceName">标准美图源</span>
                <span style="font-size:10px">▼</span>
            </div>
        </div>
    </div>
    <!-- 图片展示 -->
    <div class="image-wrapper">
        <div class="image-card" id="imageCard">
            <img id="imageView" src="" alt="图片" style="display:none;" />
            <div class="placeholder" id="placeholderText">点击「刷新列表」加载图片</div>
            <div class="loading-spinner" id="loadingSpinner"></div>
            <div class="image-info" id="imageInfo">📦 准备就绪</div>
        </div>
    </div>
    <!-- 底部按钮 -->
    <div class="bottom-area">
        <div class="btn-row">
            <button class="btn btn-primary" id="btnPrev">◀ 上一张</button>
            <button class="btn btn-secondary" id="btnRandom">🎲 随机</button>
            <button class="btn btn-primary" id="btnNext">下一张 ▶</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-outline" id="btnRefresh">🔄 刷新列表</button>
            <button class="btn btn-dark" id="btnSave">💾 保存图片</button>
        </div>
    </div>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
        <button class="close-btn" id="modalClose">✕</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>
// ============================================================
//  1. 配置：内置图源
// ============================================================
const BUILTIN_SOURCES = [
    { name: '点击我切换源', url: ''},
    { name: '标准美图源', url: 'https://api5.lianyu.best/api95.php' },
    { name: '标准美图源2', url: 'https://idc.lianyu.best/api95.php' },
    { name: '标准美图源3', url: 'https://api1.lianyu.best/api.php' },
    { name: '炼狱美图源', url: 'https://api2.lianyu.best/api.php' },
    { name: '用户上传源', url: 'https://api3.lianyu.best/api.php' },
    { name: '二次元随机图(极速)', url: 'https://www.loliapi.com/acg/pe/', type: 'image' },
    { name: '随机二次元色图', url: 'https://sex.nyan.run/api/v2/img', type: 'image' },
    { name: '小兔子随机图', url: 'https://imgapi.xl0408.top/index.php', type: 'image' },
    { name: '随机壁纸', url: 'http://www.98qy.com/sjbz/api.php', type: 'image' },
    { name: '板栗美图1', url: 'https://t.alcy.cc/mp', type: 'image' },
    { name: '板栗美图2', url: 'https://t.alcy.cc/pc', type: 'image' },
    { name: '板栗美图3', url: 'https://t.alcy.cc/ycy', type: 'image' },
    { name: '板栗美图4', url: 'https://t.alcy.cc/xhl', type: 'image' },
    { name: '板栗美图5', url: 'https://t.alcy.cc/lai', type: 'image' },
    { name: '板栗美图6', url: 'https://t.alcy.cc/tx', type: 'image' },
    { name: '板栗美图7', url: 'https://t.alcy.cc/aimp', type: 'image' },
    { name: '板栗美图8', url: 'https://t.alcy.cc/ysmp', type: 'image' },
    { name: '板栗美图9', url: 'https://t.alcy.cc/moemp', type: 'image' },
    { name: '板栗美图10', url: 'https://t.alcy.cc/bd', type: 'image' },
    { name: '板栗美图11', url: 'https://t.alcy.cc/moe', type: 'image' },
    { name: '板栗美图12', url: 'https://t.alcy.cc/ysz', type: 'image' },
    { name: '板栗美图13', url: 'https://t.alcy.cc/ai', type: 'image' },
    { name: '板栗美图14', url: 'https://t.alcy.cc/moez', type: 'image' },
    { name: '杂图1', url: 'https://api.suyanw.cn/api/ys', type: 'image' },
    { name: '杂图2', url: 'https://v2.xxapi.cn/api/heisi?return=302', type: 'image' },
    { name: '杂图3', url: 'https://v2.xxapi.cn/api/baisi?return=302', type: 'image' },
    { name: '杂图4', url: 'https://v2.xxapi.cn/api/meinvpic?return=302', type: 'image' },
    { name: '杂图5', url: 'https://v2.xxapi.cn/api/randomAcgPic?type=pc&return=302', type: 'image' },
    { name: '杂图6', url: 'https://api.seaya.link/random?type=file', type: 'image' },
    { name: '杂图7', url: 'https://api.seaya.link/wap?type=file', type: 'image' },
    { name: '杂图8', url: 'https://api.suyanw.cn/api/comic/api.php', type: 'image' },
    { name: '杂图9', url: 'https://api.suyanw.cn/api/ksxjj', type: 'image' },
    { name: '杂图10', url: 'https://api.suyanw.cn/api/mao', type: 'image' },
];

// ============================================================
//  2. 状态变量
// ============================================================
let customSources = [];
let apiList = [];
let currentSourceIndex = 0;
let currentServerUrl = '';
let imageList = [];
let currentImageIndex = 0;
let isLoading = false;
let retryCount = 0;
let lastClickTime = 0;

const $ = id => document.getElementById(id);
const imageView = $('imageView');
const placeholderText = $('placeholderText');
const loadingSpinner = $('loadingSpinner');
const imageInfo = $('imageInfo');
const currentSourceName = $('currentSourceName');
const modalOverlay = $('modalOverlay');
const modalContent = $('modalContent');
const modalClose = $('modalClose');

// ============================================================
//  3. 工具函数
// ============================================================
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function loadCustomSources() {
    try {
        const raw = localStorage.getItem('lianyu_custom_sources');
        if (raw) { const data = JSON.parse(raw); if (Array.isArray(data)) return data; }
    } catch (_) {}
    return [];
}

function saveCustomSources(list) {
    localStorage.setItem('lianyu_custom_sources', JSON.stringify(list));
}

function buildApiList() {
    const list = [];
    BUILTIN_SOURCES.forEach(s => list.push({ ...s }));
    customSources.forEach(s => list.push({ ...s }));
    return list;
}

function clearCache(sourceUrl) {
    localStorage.removeItem('lianyu_cache_' + sourceUrl);
}

function saveCache(sourceUrl, images) {
    try {
        const data = { time: Date.now(), images: images };
        localStorage.setItem('lianyu_cache_' + sourceUrl, JSON.stringify(data));
    } catch (_) {}
}

function cleanUrl(url) {
    if (typeof url !== 'string') return '';
    let cleaned = url.replace(/\\/g, '').replace(/\s/g, '');
    cleaned = cleaned.replace(/(https?:\/\/[^\/]+)\/+/g, '$1/');
    return cleaned;
}

function resolveImageUrl(baseApiUrl, relativeUrl) {
    if (!relativeUrl) return '';
    if (/^https?:\/\//i.test(relativeUrl)) return relativeUrl;
    try {
        const urlObj = new URL(baseApiUrl);
        const base = urlObj.origin;
        if (relativeUrl.startsWith('/')) return base + relativeUrl;
        const path = urlObj.pathname;
        const lastSlash = path.lastIndexOf('/');
        const dir = path.substring(0, lastSlash + 1);
        return base + dir + relativeUrl;
    } catch (_) { return relativeUrl; }
}

function showToast(msg) {
    const old = document.querySelector('.toast-tip');
    if (old) old.remove();
    const div = document.createElement('div');
    div.className = 'toast-tip';
    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 300); }, 2200);
}

function closeModal() { modalOverlay.classList.remove('active'); }

// ============================================================
//  4. 核心：获取图片列表
// ============================================================
function fetchImageList(forceRefresh) {
    if (isLoading) { showToast('正在加载中，请稍候'); return; }

    const src = apiList[currentSourceIndex];
    if (!src) {
        imageInfo.textContent = '❌ 图源配置错误';
        imageInfo.className = 'image-info error';
        return;
    }

    if (src.type === 'image') {
        loadingSpinner.style.display = 'none';
        const ts = Date.now();
        const rand = randomInt(1000, 9999);
        imageList = [{
            url: src.url,
            title: '随机图片（极速）',
            _reqId: ts + '_' + rand,
            _isImageType: true,
        }];
        imageInfo.textContent = '随机图片源 | 源：' + (src.name || '未命名');
        imageInfo.className = 'image-info';
        showImage(0);
        return;
    }

    if (forceRefresh) {
        clearCache(currentServerUrl);
    }

    if (!forceRefresh) {
        try {
            const raw = localStorage.getItem('lianyu_cache_' + currentServerUrl);
            if (raw) {
                const data = JSON.parse(raw);
                if (data && data.images && Array.isArray(data.images) && data.images.length > 0) {
                    imageList = data.images;
                    imageInfo.textContent = '📦 缓存加载 | 源：' + (src.name || '未命名');
                    imageInfo.className = 'image-info';
                    if (imageList.length > 0) showImage(randomInt(0, imageList.length - 1));
                    else { imageInfo.textContent = '⚠️ 缓存无有效图片'; imageInfo.className = 'image-info error'; }
                    return;
                }
            }
        } catch (_) {}
    }

    isLoading = true;
    loadingSpinner.style.display = 'block';
    imageInfo.textContent = '⏳ 正在获取 ' + (src.name || '未命名') + '...';
    imageInfo.className = 'image-info';
    placeholderText.style.display = 'none';
    imageView.style.display = 'none';

    fetch(currentServerUrl, { method: 'GET', cache: 'no-cache' })
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(text => {
            isLoading = false;
            loadingSpinner.style.display = 'none';
            try {
                const data = JSON.parse(text);
                if (data && data.images && Array.isArray(data.images)) {
                    const valid = data.images
                        .map(item => {
                            let url = '';
                            let title = '';
                            if (typeof item === 'string') {
                                url = item;
                                title = '图片';
                            } else if (item && typeof item === 'object') {
                                if (item.url && typeof item.url === 'string') url = item.url;
                                else if (item.src && typeof item.src === 'string') url = item.src;
                                else if (item.link && typeof item.link === 'string') url = item.link;
                                else if (item.path && typeof item.path === 'string') url = item.path;
                                else if (item.file && typeof item.file === 'string') url = item.file;
                                else if (item.image && typeof item.image === 'string') url = item.image;
                                else if (item.img && typeof item.img === 'string') url = item.img;
                                else if (item.download_url && typeof item.download_url === 'string') url = item.download_url;
                                else if (item[1] && typeof item[1] === 'string') url = item[1];
                                if (item.title) title = item.title;
                                else if (item.name) title = item.name;
                                else if (item.filename) title = item.filename;
                                else title = '图片';
                            }
                            if (!url) return null;
                            url = cleanUrl(url);
                            if (!url) return null;
                            return { url, title };
                        })
                        .filter(item => item !== null);

                    console.log('[炼狱美图] 有效图片:', valid.length, '原始:', data.images.length);
                    if (valid.length === 0) {
                        imageInfo.textContent = '⚠️ 所有图片地址无效，请检查源';
                        imageInfo.className = 'image-info error';
                        placeholderText.style.display = 'block';
                        placeholderText.textContent = '没有可用的图片';
                        return;
                    }
                    imageList = valid;
                    saveCache(currentServerUrl, imageList);
                    imageInfo.textContent = '✅ 共 ' + imageList.length + ' 张图片 | 源：' + (src.name || '未命名');
                    imageInfo.className = 'image-info success';
                    showImage(randomInt(0, imageList.length - 1));
                } else {
                    throw new Error('数据格式错误');
                }
            } catch (e) {
                imageInfo.textContent = '❌ 数据解析失败: ' + e.message;
                imageInfo.className = 'image-info error';
                showToast('数据解析失败');
                console.error('[炼狱美图] 解析失败:', e, text.substring(0, 200));
                placeholderText.style.display = 'block';
                placeholderText.textContent = '数据解析失败';
            }
        })
        .catch(err => {
            isLoading = false;
            loadingSpinner.style.display = 'none';
            imageInfo.textContent = '❌ 请求失败: ' + err.message;
            imageInfo.className = 'image-info error';
            showToast('无法连接到服务器');
            console.error('[炼狱美图] 请求失败:', err);
            placeholderText.style.display = 'block';
            placeholderText.textContent = '网络请求失败';
        });
}

// ============================================================
//  5. 显示图片  【关键修改：移除 crossOrigin】
// ============================================================
function showImage(index) {
    if (!imageList || imageList.length === 0) {
        placeholderText.style.display = 'block';
        imageView.style.display = 'none';
        imageInfo.textContent = '暂无图片，请刷新列表';
        imageInfo.className = 'image-info error';
        return;
    }

    if (index < 0) index = imageList.length - 1;
    if (index >= imageList.length) index = 0;
    currentImageIndex = index;
    retryCount = 0;

    const item = imageList[currentImageIndex];
    console.log('[炼狱美图] 当前图片:', item);

    let rawUrl = item.url || '';
    let title = item.title || ('图片 ' + (currentImageIndex + 1));

    if (!rawUrl) {
        console.warn('[炼狱美图] 无效地址，跳过:', item);
        showImage(currentImageIndex + 1);
        return;
    }

    const src = apiList[currentSourceIndex];
    let finalUrl = rawUrl;
    if (src && !src.type) {
        finalUrl = resolveImageUrl(currentServerUrl, rawUrl);
    } else if (src && src.type === 'image') {
        const reqId = (item._reqId) ? item._reqId : Date.now();
        const sep = finalUrl.indexOf('?') === -1 ? '?' : '&';
        finalUrl = finalUrl + sep + 't=' + reqId;
    }
    finalUrl = cleanUrl(finalUrl);
    console.log('[炼狱美图] 最终地址:', finalUrl);

    loadingSpinner.style.display = 'block';
    imageView.style.display = 'none';
    placeholderText.style.display = 'none';
    imageInfo.textContent = '⏳ 加载中：' + title + ' (' + (currentImageIndex + 1) + '/' + imageList.length + ')';
    imageInfo.className = 'image-info';

    loadImageDirect(finalUrl, title);
}

function loadImageDirect(url, title) {
    const img = new Image();
    let timeoutId = null;

    // ❌ 不要加 crossOrigin！API 服务器没有 CORS 头
    // img.crossOrigin = 'anonymous';  ← 已移除

    timeoutId = setTimeout(() => {
        img.src = '';
        if (retryCount < 2) {
            retryCount++;
            imageInfo.textContent = '⏳ 超时，重试 ' + retryCount + '/2';
            loadImageDirect(url, title);
        } else {
            loadingSpinner.style.display = 'none';
            placeholderText.style.display = 'block';
            placeholderText.textContent = '⏭️ 加载超时，跳转下一张';
            imageInfo.textContent = '⏭️ 跳转中...';
            imageInfo.className = 'image-info';
            console.warn('[炼狱美图] 超时:', url);
            setTimeout(() => showImage(currentImageIndex + 1), 300);
        }
    }, 15000);

    img.onload = function() {
        clearTimeout(timeoutId);
        loadingSpinner.style.display = 'none';
        imageView.src = url;
        imageView.style.display = 'block';
        const src = apiList[currentSourceIndex];
        imageInfo.textContent = title + ' (' + (currentImageIndex + 1) + '/' + imageList.length + ') | 源：' + (src ? src.name : '未命名');
        imageInfo.className = 'image-info';
        retryCount = 0;
        console.log('[炼狱美图] 加载成功:', url);
    };

    img.onerror = function() {
        clearTimeout(timeoutId);
        if (retryCount < 2) {
            retryCount++;
            imageInfo.textContent = '⏳ 失败，重试 ' + retryCount + '/2';
            loadImageDirect(url, title);
        } else {
            loadingSpinner.style.display = 'none';
            placeholderText.style.display = 'block';
            placeholderText.textContent = '⏭️ 加载失败，跳转下一张';
            imageInfo.textContent = '⏭️ 跳转中...';
            imageInfo.className = 'image-info';
            console.warn('[炼狱美图] 加载失败:', url);
            setTimeout(() => showImage(currentImageIndex + 1), 300);
        }
    };

    img.src = url;
}

// ============================================================
//  6. 导航
// ============================================================
function showPrev() { showImage(currentImageIndex - 1); }
function showNext() { showImage(currentImageIndex + 1); }
function showRandom() {
    if (!imageList || imageList.length === 0) return;
    showImage(randomInt(0, imageList.length - 1));
}

// ============================================================
//  7. 保存图片 —— 绕过跨域：直接新窗口打开
// ============================================================
function saveCurrentImage() {
    if (!imageList || imageList.length === 0) { showToast('没有可保存的图片'); return; }
    const item = imageList[currentImageIndex];
    let url = item.url || '';
    if (!url) { showToast('❌ 无法获取图片地址'); return; }

    const src = apiList[currentSourceIndex];
    if (src && !src.type) {
        url = resolveImageUrl(currentServerUrl, url);
    }
    url = cleanUrl(url);

    // 使用当前显示的图片地址（带时间戳的）
    const displayUrl = imageView.src || url;
    if (!displayUrl || !displayUrl.startsWith('http')) {
        showToast('❌ 无效的图片地址');
        return;
    }

    // 策略：直接在新窗口打开图片，让用户右键保存
    // 这是绕过跨域限制最可靠的方式
    imageInfo.textContent = '⏳ 正在打开图片...';
    imageInfo.className = 'image-info';

    const win = window.open(displayUrl, '_blank');
    if (win) {
        win.focus();
        showToast('📤 已在新窗口打开，请右键保存');
        setTimeout(() => {
            imageInfo.textContent = '📤 已在新窗口打开，请右键保存';
            imageInfo.className = 'image-info';
        }, 500);
    } else {
        // 弹窗被拦截，尝试直接下载
        const a = document.createElement('a');
        a.href = displayUrl;
        a.download = 'lianyu_' + Date.now() + '.jpg';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('⏳ 尝试下载中，请查看下载列表');
        setTimeout(() => {
            imageInfo.textContent = '⏳ 尝试下载中，请查看浏览器下载列表';
            imageInfo.className = 'image-info';
        }, 1000);
    }
}

// ============================================================
//  8. 切换图源
// ============================================================
function switchSource(index) {
    if (index < 0 || index >= apiList.length) return;
    currentSourceIndex = index;
    currentServerUrl = apiList[index].url || '';
    currentSourceName.textContent = apiList[index].name || '未命名';
    showToast('已切换到：' + (apiList[index].name || '未命名'));
    clearCache(currentServerUrl);
    imageList = [];
    imageView.style.display = 'none';
    placeholderText.style.display = 'block';
    placeholderText.textContent = '正在加载...';
    imageInfo.textContent = '🔄 切换图源';
    imageInfo.className = 'image-info';
    fetchImageList(true);
}

// ============================================================
//  9-13. 对话框、设置、事件绑定、启动
// ============================================================
function showSourceDialog() {
    const items = [];
    apiList.forEach((s, i) => {
        let label = s.name || '未命名';
        if (i >= BUILTIN_SOURCES.length) label += ' [自定义]';
        items.push({ label, index: i });
    });
    items.push({ label: '➕ 添加新图源', index: -1 });

    let html = '<h3>选择图源</h3>';
    items.forEach(item => {
        const cls = (item.index === currentSourceIndex) ? 'modal-item active' : 'modal-item';
        const mark = (item.index === currentSourceIndex) ? ' ✅' : '';
        html += `<div class="${cls}" data-index="${item.index}">${item.label}${mark}</div>`;
    });
    html += `
        <div style="margin-top:12px;display:flex;gap:10px;">
            <button class="btn btn-confirm" id="modalManageCustom" style="flex:1;">⚙️ 管理自定义源</button>
            <button class="btn btn-cancel" id="modalCloseSource" style="flex:1;">取消</button>
        </div>
    `;

    modalContent.innerHTML = html;
    modalOverlay.classList.add('active');

    modalContent.querySelectorAll('.modal-item').forEach(el => {
        el.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            if (idx === -1) { closeModal(); showAddSourceDialog(); }
            else { closeModal(); switchSource(idx); }
        });
    });
    document.getElementById('modalManageCustom').addEventListener('click', function() { closeModal(); showManageCustomDialog(); });
    document.getElementById('modalCloseSource').addEventListener('click', closeModal);
    modalClose.onclick = closeModal;
    modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
}

function showAddSourceDialog() {
    let html = `
        <h3>➕ 添加新图源</h3>
        <div class="modal-input-group">
            <label>图源名称</label>
            <input id="addSrcName" type="text" placeholder="例如：我的私人图源" />
        </div>
        <div class="modal-input-group">
            <label>API 地址</label>
            <input id="addSrcUrl" type="text" placeholder="例如：http://xxx.com/api.php" />
        </div>
        <div class="modal-actions">
            <button class="btn btn-cancel" id="addSrcCancel">取消</button>
            <button class="btn btn-confirm" id="addSrcConfirm">添加</button>
        </div>
    `;
    modalContent.innerHTML = html;
    modalOverlay.classList.add('active');

    const nameInput = document.getElementById('addSrcName');
    const urlInput = document.getElementById('addSrcUrl');
    document.getElementById('addSrcCancel').addEventListener('click', closeModal);
    document.getElementById('addSrcConfirm').addEventListener('click', function() {
        const name = nameInput.value.trim();
        const url = urlInput.value.trim();
        if (!name || !url) { showToast('名称和地址不能为空'); return; }
        if (!/^https?:\/\//i.test(url)) { showToast('地址必须以 http:// 或 https:// 开头'); return; }
        customSources.push({ name, url });
        saveCustomSources(customSources);
        apiList = buildApiList();
        showToast('✅ 添加成功：' + name);
        closeModal();
        const newIdx = apiList.length - 1;
        switchSource(newIdx);
    });
    modalClose.onclick = closeModal;
    modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
}

function showManageCustomDialog() {
    if (customSources.length === 0) { showToast('暂无自定义源'); return; }
    let html = '<h3>管理自定义源</h3>';
    customSources.forEach((s, i) => {
        const isActive = (apiList.indexOf(s) === currentSourceIndex);
        const mark = isActive ? ' ✅' : '';
        html += `<div class="modal-item" data-idx="${i}">${s.name}${mark} <span class="badge custom">自定义</span></div>`;
    });
    html += `
        <div style="margin-top:12px;display:flex;gap:10px;">
            <button class="btn btn-danger" id="modalDeleteAllCustom" style="flex:1;">🗑️ 删除全部</button>
            <button class="btn btn-cancel" id="modalCloseManage" style="flex:1;">关闭</button>
        </div>
    `;
    modalContent.innerHTML = html;
    modalOverlay.classList.add('active');

    modalContent.querySelectorAll('.modal-item').forEach(el => {
        el.addEventListener('click', function() {
            const idx = parseInt(this.dataset.idx);
            const src = customSources[idx];
            if (src) {
                const globalIdx = apiList.indexOf(src);
                if (globalIdx >= 0) { closeModal(); switchSource(globalIdx); }
            }
        });
    });
    document.getElementById('modalDeleteAllCustom').addEventListener('click', function() {
        if (confirm('确定要删除所有自定义源吗？')) {
            customSources = [];
            saveCustomSources(customSources);
            apiList = buildApiList();
            currentSourceIndex = 0;
            currentServerUrl = apiList[0]?.url || '';
            currentSourceName.textContent = apiList[0]?.name || '未命名';
            imageList = [];
            imageView.style.display = 'none';
            placeholderText.style.display = 'block';
            placeholderText.textContent = '已清空自定义源';
            imageInfo.textContent = '已清空所有自定义源';
            imageInfo.className = 'image-info';
            closeModal();
            showToast('已清空所有自定义源');
            fetchImageList(true);
        }
    });
    document.getElementById('modalCloseManage').addEventListener('click', closeModal);
    modalClose.onclick = closeModal;
    modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
}

function showSettings() {
    const items = [
        { label: '⬆️ 上传图片', action: 'upload' },
        { label: '🏠 访问官网', action: 'website' },
        { label: '💬 QQ群', action: 'qq' },
        { label: '🎮 加入KOOK(QQ群封了就加)', action: 'kook' },
    ];
    let html = '<h3>⚙️ 设置</h3>';
    items.forEach(item => {
        html += `<div class="modal-item" data-action="${item.action}">${item.label}</div>`;
    });
    html += `<div style="margin-top:12px;"><button class="btn btn-cancel w-full" id="modalCloseSettings">取消</button></div>`;
    modalContent.innerHTML = html;
    modalOverlay.classList.add('active');

    modalContent.querySelectorAll('.modal-item').forEach(el => {
        el.addEventListener('click', function() {
            const action = this.dataset.action;
            closeModal();
            switch (action) {
                case 'upload': window.open('http://sc.lianyu.best/', '_blank'); break;
                case 'website': window.open('http://lianyu.best/', '_blank'); break;
                case 'qq': window.open('https://qm.qq.com/q/qF1OqmXVjW', '_blank'); break;
                case 'kook': window.open('https://kook.vip/B2RczW', '_blank'); break;
            }
        });
    });
    document.getElementById('modalCloseSettings').addEventListener('click', closeModal);
    modalClose.onclick = closeModal;
    modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
}

function bindEvents() {
    document.getElementById('btnPrev').addEventListener('click', showPrev);
    document.getElementById('btnNext').addEventListener('click', showNext);
    document.getElementById('btnRandom').addEventListener('click', showRandom);
    document.getElementById('btnRefresh').addEventListener('click', function() { fetchImageList(true); });
    document.getElementById('btnSave').addEventListener('click', saveCurrentImage);
    document.getElementById('btnSettings').addEventListener('click', showSettings);
    document.getElementById('btnSourceSwitch').addEventListener('click', showSourceDialog);

    imageView.addEventListener('click', function() {
        const now = Date.now();
        if (now - lastClickTime < 400) showNext();
        lastClickTime = now;
    });
    placeholderText.addEventListener('click', function() {
        const now = Date.now();
        if (now - lastClickTime < 400) showNext();
        lastClickTime = now;
    });

    document.addEventListener('keydown', function(e) {
        if (modalOverlay.classList.contains('active')) { if (e.key === 'Escape') closeModal(); return; }
        if (e.key === 'ArrowLeft') showPrev();
        else if (e.key === 'ArrowRight') showNext();
        else if (e.key === 'r' || e.key === 'R') fetchImageList(true);
        else if (e.key === 's' || e.key === 'S') saveCurrentImage();
    });
}

function initApp() {
    customSources = loadCustomSources();
    apiList = buildApiList();
    currentSourceIndex = 0;
    currentServerUrl = apiList[0]?.url || '';
    currentSourceName.textContent = apiList[0]?.name || '未命名';
    clearCache(currentServerUrl);
    fetchImageList(true);
}

document.addEventListener('DOMContentLoaded', function() {
    initApp();
    bindEvents();
});
</script>
</body>
